<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code Generator — Farnham Urban Sketchers & Friends</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Scoped to this page only - reuses the site's colour tokens from
       style.css (:root vars) so it stays visually consistent with the
       rest of the portal without touching the shared stylesheet. */
    .tool-card {
      background: white;
      border-radius: 10px;
      box-shadow: var(--shadow-btn);
      padding: 24px 20px;
      margin-bottom: 20px;
      text-align: left;
    }

    .tool-label {
      display: block;
      font-size: 0.9em;
      font-weight: bold;
      color: var(--color-heading);
      margin-bottom: 6px;
    }

    #qrInput {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    #qrInput:focus {
      outline: none;
      border-color: var(--color-accent);
    }

    .size-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .size-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.85em;
      border: 1px solid #ddd;
      background: white;
      color: var(--color-text);
      border-radius: 6px;
      cursor: pointer;
    }

    .size-btn.active {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: white;
      font-weight: bold;
    }

    .generate-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--color-accent);
      color: white;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
    }

    .generate-btn:disabled {
      background: var(--color-disabled-bg);
      color: var(--color-disabled-text);
      cursor: not-allowed;
    }

    #qrError {
      color: #c0392b;
      font-size: 0.85em;
      margin-top: 8px;
      min-height: 1.2em;
    }

    #qrOutput {
      text-align: center;
      padding: 20px 0 4px;
    }

    #qrOutput svg {
      /* No fixed width here - the generated <svg>'s own width/height
         attributes (driven by the selected module size) set the native
         size; this just stops a "large" code from overflowing the card. */
      max-width: 100%;
      height: auto;
    }

    .download-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .download-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--color-accent);
      background: white;
      color: var(--color-accent);
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9em;
      cursor: pointer;
    }

    .download-btn:hover {
      background: #eaf4fb;
    }

    .back-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="exhib-name">Farnham Urban Sketchers & Friends</div>
    <div class="subtitle">QR Code Generator</div>

    <div class="tool-card">
      <label class="tool-label" for="qrInput">URL or text to encode</label>
      <input type="text" id="qrInput" placeholder="https://example.com" autocomplete="off">

      <div class="size-row" id="sizeRow">
        <button type="button" class="size-btn" data-size="4">Small</button>
        <button type="button" class="size-btn active" data-size="8">Medium</button>
        <button type="button" class="size-btn" data-size="12">Large</button>
      </div>

      <button type="button" class="generate-btn" id="generateBtn">Generate QR Code</button>
      <p id="qrError"></p>
    </div>

    <div class="tool-card" id="resultCard" style="display:none;">
      <div id="qrOutput"></div>
      <div class="download-row">
        <button type="button" class="download-btn" id="downloadSvgBtn">Download SVG</button>
        <button type="button" class="download-btn" id="downloadPngBtn">Download PNG</button>
      </div>
    </div>

    <a href="index.html" class="back-link">&larr; Back to Portal Home</a>
  </div>

  <script>
    /* ==========================================================
       QR encoder (byte mode, ECC level L) - copied verbatim from
       QRCode.gs.md, the same encoder the Apps Script backend uses
       for self-print artwork labels, Card Master List, and Visual
       Index QRs. Kept in sync manually; if you change the encoding
       logic here, mirror the change back into QRCode.gs.md (and
       vice versa) so both stay identical.
       ========================================================== */

    const _QR_ECC_CODEWORDS_PER_BLOCK = {
      L: [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    };
    const _QR_NUM_ERROR_CORRECTION_BLOCKS = {
      L: [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    };

    function _qrGetAlignmentPatternPositions(ver) {
      if (ver === 1) return [];
      const numAlign = Math.floor(ver / 7) + 2;
      const size = ver * 4 + 17;
      let step;
      if (ver === 32) step = 26;
      else step = Math.ceil((size - 13) / (2 * numAlign - 2)) * 2;
      const result = [6];
      for (let pos = size - 7; result.length < numAlign; pos -= step) result.splice(1, 0, pos);
      return result;
    }

    function _qrNumRawDataModules(ver) {
      const size = ver * 4 + 17;
      let result = size * size;
      result -= 8 * 8 * 3;
      result -= 15 * 2 + 1;
      result -= (size - 16) * 2;
      if (ver >= 7) result -= 6 * 3 * 2;
      const align = _qrGetAlignmentPatternPositions(ver);
      const numAlign = align.length;
      if (numAlign > 0) {
        result -= (numAlign * numAlign - 3) * 25;
        result += (numAlign - 2) * 2 * 5;
      }
      return result;
    }

    function _qrGetNumDataCodewords(ver, ecl) {
      return Math.floor(_qrNumRawDataModules(ver) / 8)
        - _QR_ECC_CODEWORDS_PER_BLOCK[ecl][ver] * _QR_NUM_ERROR_CORRECTION_BLOCKS[ecl][ver];
    }

    function _qrRsMultiply(x, y) {
      let z = 0;
      for (let i = 7; i >= 0; i--) {
        z = (z << 1) ^ ((z >>> 7) * 0x11D);
        z ^= ((y >>> i) & 1) * x;
      }
      return z & 0xFF;
    }

    function _qrRsComputeDivisor(degree) {
      const result = new Array(degree).fill(0);
      result[degree - 1] = 1;
      let root = 1;
      for (let i = 0; i < degree; i++) {
        for (let j = 0; j < result.length; j++) {
          result[j] = _qrRsMultiply(result[j], root);
          if (j + 1 < result.length) result[j] ^= result[j + 1];
        }
        root = _qrRsMultiply(root, 0x02);
      }
      return result;
    }

    function _qrRsComputeRemainder(data, divisor) {
      const result = new Array(divisor.length).fill(0);
      for (const b of data) {
        const factor = b ^ result[0];
        result.copyWithin(0, 1);
        result[result.length - 1] = 0;
        for (let i = 0; i < result.length; i++) result[i] ^= _qrRsMultiply(divisor[i], factor);
      }
      return result;
    }

    function _qrStringToUtf8Bytes(str) {
      const bytes = [];
      for (let i = 0; i < str.length; i++) {
        let code = str.codePointAt(i);
        if (code > 0xFFFF) i++;
        if (code < 0x80) {
          bytes.push(code);
        } else if (code < 0x800) {
          bytes.push(0xC0 | (code >> 6), 0x80 | (code & 0x3F));
        } else if (code < 0x10000) {
          bytes.push(0xE0 | (code >> 12), 0x80 | ((code >> 6) & 0x3F), 0x80 | (code & 0x3F));
        } else {
          bytes.push(0xF0 | (code >> 18), 0x80 | ((code >> 12) & 0x3F), 0x80 | ((code >> 6) & 0x3F), 0x80 | (code & 0x3F));
        }
      }
      return bytes;
    }

    function _qrMakeBitBuffer() {
      return { bits: [], appendBits: function(val, len) { for (let i = len - 1; i >= 0; i--) this.bits.push((val >>> i) & 1); } };
    }

    function _qrEncodeByteMode(text, ver, ecl) {
      const dataBytes = _qrStringToUtf8Bytes(text);
      const bb = _qrMakeBitBuffer();
      bb.appendBits(0b0100, 4);
      const ccBits = ver <= 9 ? 8 : 16;
      bb.appendBits(dataBytes.length, ccBits);
      for (const byte of dataBytes) bb.appendBits(byte, 8);

      const dataCapacityBits = _qrGetNumDataCodewords(ver, ecl) * 8;
      if (bb.bits.length > dataCapacityBits) throw new Error('Data too long for version ' + ver);

      bb.appendBits(0, Math.min(4, dataCapacityBits - bb.bits.length));
      while (bb.bits.length % 8 !== 0) bb.bits.push(0);
      for (let padByte = 0xEC; bb.bits.length < dataCapacityBits; padByte ^= 0xEC ^ 0x11) bb.appendBits(padByte, 8);

      const dataCodewords = [];
      for (let i = 0; i < bb.bits.length; i += 8) {
        let byte = 0;
        for (let j = 0; j < 8; j++) byte = (byte << 1) | bb.bits[i + j];
        dataCodewords.push(byte);
      }
      return dataCodewords;
    }

    function _qrAddEccAndInterleave(dataCodewords, ver, ecl) {
      const numBlocks = _QR_NUM_ERROR_CORRECTION_BLOCKS[ecl][ver];
      const blockEccLen = _QR_ECC_CODEWORDS_PER_BLOCK[ecl][ver];
      const rawCodewords = Math.floor(_qrNumRawDataModules(ver) / 8);
      const numShortBlocks = numBlocks - (rawCodewords % numBlocks);
      const shortBlockLen = Math.floor(rawCodewords / numBlocks);

      const blocks = [];
      const rsDiv = _qrRsComputeDivisor(blockEccLen);
      let k = 0;
      for (let i = 0; i < numBlocks; i++) {
        const dataLen = shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1);
        const dat = dataCodewords.slice(k, k + dataLen);
        k += dataLen;
        const ecc = _qrRsComputeRemainder(dat, rsDiv);
        blocks.push({ dat: dat, ecc: ecc });
      }

      const result = [];
      const maxDataLen = Math.max.apply(null, blocks.map(function(b) { return b.dat.length; }));
      for (let i = 0; i < maxDataLen; i++) {
        for (const b of blocks) if (i < b.dat.length) result.push(b.dat[i]);
      }
      for (let i = 0; i < blockEccLen; i++) {
        for (const b of blocks) result.push(b.ecc[i]);
      }
      return result;
    }

    function _qrMakeMatrix(text, ecl) {
      let ver, dataCodewords;
      for (ver = 1; ver <= 40; ver++) {
        try {
          dataCodewords = _qrEncodeByteMode(text, ver, ecl);
          break;
        } catch (e) { if (ver === 40) throw e; }
      }
      const allCodewords = _qrAddEccAndInterleave(dataCodewords, ver, ecl);
      return _qrBuildMatrix(ver, ecl, allCodewords);
    }

    function _qrBuildMatrix(ver, ecl, codewords) {
      const size = ver * 4 + 17;
      const modules = [];
      const isFunction = [];
      for (let y = 0; y < size; y++) { modules.push(new Array(size).fill(false)); isFunction.push(new Array(size).fill(false)); }

      function setFunc(x, y, v) { modules[y][x] = v; isFunction[y][x] = true; }
      function getBit(x, i) { return ((x >>> i) & 1) !== 0; }

      function drawFinder(x, y) {
        for (let dy = -4; dy <= 4; dy++) {
          for (let dx = -4; dx <= 4; dx++) {
            const xx = x + dx, yy = y + dy;
            if (xx < 0 || xx >= size || yy < 0 || yy >= size) continue;
            const dist = Math.max(Math.abs(dx), Math.abs(dy));
            setFunc(xx, yy, dist !== 2 && dist !== 4);
          }
        }
      }
      function drawAlignment(x, y) {
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) setFunc(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }

      for (let i = 0; i < size; i++) {
        if (!isFunction[6][i]) setFunc(i, 6, i % 2 === 0);
        if (!isFunction[i][6]) setFunc(6, i, i % 2 === 0);
      }

      drawFinder(3, 3);
      drawFinder(size - 4, 3);
      drawFinder(3, size - 4);

      const align = _qrGetAlignmentPatternPositions(ver);
      for (const ax of align) {
        for (const ay of align) {
          if ((ax === 6 && ay === 6) || (ax === 6 && ay === size - 7) || (ax === size - 7 && ay === 6)) continue;
          drawAlignment(ax, ay);
        }
      }

      function drawFormatBits(mask) {
        const eccBits = { L: 1, M: 0, Q: 3, H: 2 }[ecl];
        const data = (eccBits << 3) | mask;
        let rem = data;
        for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
        const bits = ((data << 10) | rem) ^ 0x5412;

        for (let i = 0; i <= 5; i++) setFunc(8, i, getBit(bits, i));
        setFunc(8, 7, getBit(bits, 6));
        setFunc(8, 8, getBit(bits, 7));
        setFunc(7, 8, getBit(bits, 8));
        for (let i = 9; i < 15; i++) setFunc(14 - i, 8, getBit(bits, i));

        for (let i = 0; i < 8; i++) setFunc(size - 1 - i, 8, getBit(bits, i));
        for (let i = 8; i < 15; i++) setFunc(8, size - 15 + i, getBit(bits, i));
        setFunc(8, size - 8, true);
      }

      if (ver >= 7) {
        let rem = ver;
        for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
        const bits = (ver << 12) | rem;
        for (let i = 0; i < 18; i++) {
          const bit = getBit(bits, i);
          const a = size - 11 + (i % 3), b = Math.floor(i / 3);
          setFunc(a, b, bit);
          setFunc(b, a, bit);
        }
      }

      drawFormatBits(0);

      const bitsQueue = [];
      for (const b of codewords) for (let i = 7; i >= 0; i--) bitsQueue.push((b >>> i) & 1);
      let bitIdx = 0;
      let upward = true;
      for (let colRight = size - 1; colRight >= 1; colRight -= 2) {
        if (colRight === 6) colRight = 5;
        for (let vert = 0; vert < size; vert++) {
          const y = upward ? size - 1 - vert : vert;
          for (let j = 0; j < 2; j++) {
            const x = colRight - j;
            if (isFunction[y][x]) continue;
            let bit = false;
            if (bitIdx < bitsQueue.length) { bit = bitsQueue[bitIdx] === 1; bitIdx++; }
            modules[y][x] = bit;
          }
        }
        upward = !upward;
      }

      function applyMask(mask) {
        const out = modules.map(function(r) { return r.slice(); });
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            if (isFunction[y][x]) continue;
            let invert;
            switch (mask) {
              case 0: invert = (x + y) % 2 === 0; break;
              case 1: invert = y % 2 === 0; break;
              case 2: invert = x % 3 === 0; break;
              case 3: invert = (x + y) % 3 === 0; break;
              case 4: invert = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
              case 5: invert = (x * y) % 2 + (x * y) % 3 === 0; break;
              case 6: invert = ((x * y) % 2 + (x * y) % 3) % 2 === 0; break;
              case 7: invert = ((x + y) % 2 + (x * y) % 3) % 2 === 0; break;
            }
            if (invert) out[y][x] = !out[y][x];
          }
        }
        return out;
      }

      function transpose(mat) { return mat[0].map(function(_, i) { return mat.map(function(r) { return r[i]; }); }); }
      function countPattern(row, pat) {
        let count = 0;
        for (let i = 0; i + pat.length <= row.length; i++) {
          let match = true;
          for (let j = 0; j < pat.length; j++) if (row[i + j] !== pat[j]) { match = false; break; }
          if (match) count++;
        }
        return count;
      }

      function penalty(mat) {
        let total = 0;
        for (const line of [mat, transpose(mat)]) {
          for (const row of line) {
            let runColor = row[0], runLen = 1;
            for (let x = 1; x < row.length; x++) {
              if (row[x] === runColor) runLen++;
              else { if (runLen >= 5) total += runLen - 2; runColor = row[x]; runLen = 1; }
            }
            if (runLen >= 5) total += runLen - 2;
          }
        }
        for (let y = 0; y < size - 1; y++) {
          for (let x = 0; x < size - 1; x++) {
            const v = mat[y][x];
            if (v === mat[y][x + 1] && v === mat[y + 1][x] && v === mat[y + 1][x + 1]) total += 3;
          }
        }
        const pat1 = [true,false,true,true,true,false,true,false,false,false,false];
        const pat2 = pat1.slice().reverse();
        for (const row of mat) total += countPattern(row, pat1) * 40 + countPattern(row, pat2) * 40;
        const t = transpose(mat);
        for (const row of t) total += countPattern(row, pat1) * 40 + countPattern(row, pat2) * 40;
        let dark = 0;
        for (const row of mat) for (const v of row) if (v) dark++;
        const percent = (dark * 100) / (size * size);
        total += Math.floor(Math.abs(percent - 50) / 5) * 10;
        return total;
      }

      let bestMask = 0, bestPenalty = Infinity, bestMatrix = null;
      for (let m = 0; m < 8; m++) {
        const candidate = applyMask(m);
        const p = penalty(candidate);
        if (p < bestPenalty) { bestPenalty = p; bestMask = m; bestMatrix = candidate; }
      }

      drawFormatBits(bestMask);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) if (isFunction[y][x]) bestMatrix[y][x] = modules[y][x];
      }

      return { size: size, matrix: bestMatrix };
    }

    function _qrSvgFromMatrix(size, matrix, widthAttr, heightAttr) {
      let rects = '';
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (matrix[y][x]) rects += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
        }
      }
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" width="' + widthAttr + '" height="' + heightAttr + '" shape-rendering="crispEdges">' +
             '<rect x="0" y="0" width="' + size + '" height="' + size + '" fill="white"/>' +
             '<g fill="black">' + rects + '</g></svg>';
    }

    function buildQrCodeSvg(text, moduleSizePx) {
      const result = _qrMakeMatrix(text, 'L');
      const px = moduleSizePx * result.size;
      return _qrSvgFromMatrix(result.size, result.matrix, px, px);
    }

    /* ==========================================================
       Page wiring - everything below is specific to this standalone
       utility, not shared with the Apps Script backend.
       ========================================================== */

    let selectedModuleSize = 8;
    let lastSvgString = '';

    document.querySelectorAll('.size-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.size-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        selectedModuleSize = parseInt(btn.dataset.size, 10);
      });
    });

    function generate() {
      const input = document.getElementById('qrInput');
      const errorEl = document.getElementById('qrError');
      const outputEl = document.getElementById('qrOutput');
      const resultCard = document.getElementById('resultCard');
      const text = input.value.trim();

      errorEl.innerText = '';

      if (!text) {
        errorEl.innerText = 'Enter a URL or some text first.';
        resultCard.style.display = 'none';
        return;
      }

      try {
        lastSvgString = buildQrCodeSvg(text, selectedModuleSize);
        outputEl.innerHTML = lastSvgString;
        resultCard.style.display = 'block';
      } catch (e) {
        errorEl.innerText = 'Could not generate a QR code for that input: ' + e.message;
        resultCard.style.display = 'none';
      }
    }

    document.getElementById('generateBtn').addEventListener('click', generate);
    document.getElementById('qrInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') generate();
    });

    document.getElementById('downloadSvgBtn').addEventListener('click', function() {
      if (!lastSvgString) return;
      const blob = new Blob([lastSvgString], { type: 'image/svg+xml' });
      triggerDownload(URL.createObjectURL(blob), 'qr-code.svg');
    });

    document.getElementById('downloadPngBtn').addEventListener('click', function() {
      if (!lastSvgString) return;
      const svgBlob = new Blob([lastSvgString], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = function() {
        // Match the PNG's resolution to the size that was actually
        // generated (native width embedded in the SVG's width attribute),
        // with a floor so "Small" still produces a usable print file.
        const widthMatch = lastSvgString.match(/width="(\d+)"/);
        const nativePx = widthMatch ? parseInt(widthMatch[1], 10) : 512;
        const exportPx = Math.max(nativePx, 256);
        const canvas = document.createElement('canvas');
        canvas.width = exportPx;
        canvas.height = exportPx;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, exportPx, exportPx);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(pngBlob) {
          triggerDownload(URL.createObjectURL(pngBlob), 'qr-code.png');
        });
      };
      img.src = url;
    });

    function triggerDownload(url, filename) {
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
